[package]
name = "job-queue"
version = "0.1.0"
edition = "2024"
description = "Step-by-step study project: from a naive sync server to a production-ready async job queue in Rust"
repository = "https://github.com/graduss/job-queue"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
dashmap = "6.1.0"
dotenvy = "0.15.7"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "postgres", "uuid", "chrono", "macros"] }
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = "thin" #lto = true|"thin"|"fat"
codegen-units = 16
