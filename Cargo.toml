[package]
name = "job-queue"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.44", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.52.1", features = ["full"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }

[profile.release]
opt-level = 3
lto = "thin" #lto = true|"thin"|"fat"
codegen-units = 16
